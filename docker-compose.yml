services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-1-app
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: task_1
      DB_USERNAME: task_user
      DB_PASSWORD: task_password
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    command: >
      sh -c "composer install --no-interaction --prefer-dist &&
      php artisan key:generate --force &&
      php artisan migrate --seed &&
      php artisan serve --host=0.0.0.0 --port=8000"

  mysql:
    image: mysql:8.0
    container_name: task-1-mysql
    environment:
      MYSQL_DATABASE: task_1
      MYSQL_USER: task_user
      MYSQL_PASSWORD: task_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
